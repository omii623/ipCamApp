[package]
name = "ipcam_desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
# H.265 dekóder: FFmpeg libavcodec + swscale, statikusan linkelve (Windows-on vcpkg-ből, lásd README).
# A "format" feature kell: az ffmpeg-next swscale-része a format modulra hivatkozik.
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling", "static"] }
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.11.0"
openh264 = "0.9.10"
qrcode = "0.14.1"
rand = "0.8"
regex = "1.13.1"
retina = "0.4.22"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros"] }
ureq = "2"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

# a függőségek (dekóderek) debug módban is optimalizálva – különben akadozik az élőkép
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
